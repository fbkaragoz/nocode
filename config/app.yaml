# AI Code Generation System - Main Configuration
# Professional configuration without hardcoded prompts or model-specific settings

# Application Settings
application:
  name: "AI Code Generation System"
  version: "1.0.0"
  environment: "development"  # development, staging, production
  
# Service Configuration
services:
  
  # LLM Provider (configurable)
  llm_provider:
    type: "ollama"          # ollama, openai, anthropic, etc.
    config_file: "config/models.yaml"
    auto_detect_models: true
    fallback_enabled: true
  
  # Prompt Management
  prompt_manager:
    config_file: "config/prompts.yaml"
    enable_context_enhancement: true
    cache_prompts: true
    fallback_enabled: true
  
  # System Monitoring
  system_monitor:
    enabled: true
    update_interval: 5      # seconds
    history_size: 100       # number of metrics to keep
    gpu_detection: "auto"   # auto, nvidia, amd, intel, disabled

# Interface Configuration
interface:
  
  # Display modes
  available_modes:
    - "standard"    # Standard terminal interface
    - "analytics"   # Analytics dashboard mode
    - "minimal"     # Minimal interface for low resources
  
  default_mode: "standard"
  
  # Display settings
  display:
    syntax_highlighting: true
    show_timestamps: true
    show_progress: true
    auto_scroll: true
    max_display_lines: 50
    refresh_rate: 4
  
  # Analytics dashboard settings
  analytics:
    terminal_emulators: ["gnome-terminal", "konsole", "xterm", "alacritty", "terminator"]
    auto_launch: true
    script_location: "tmp/system_analytics.py"

# Code Generation Settings
code_generation:
  
  # Output configuration
  output:
    directory: "generated_code"
    save_format: "organized"    # organized, flat, timestamped
    auto_save: true
    create_timestamps: true
  
  # File organization
  file_organization:
    group_by_language: true
    create_project_structure: true
    include_metadata: true
  
  # Language support
  languages:
    auto_detect: true
    supported:
      - python
      - javascript
      - typescript
      - java
      - cpp
      - go
      - rust
      - php
      - ruby
      - csharp
      - html
      - css
      - sql
      - bash

# Project Management
project_management:
  
  # Multi-step projects
  multi_step:
    enabled: true
    max_steps: 10
    stages: ["planning", "design", "implementation", "testing", "optimization", "documentation"]
  
  # Task decomposition
  decomposition:
    methodology: "agile"
    detail_level: "high"
    include_estimates: true
    track_dependencies: true

# Performance Configuration
performance:
  
  # Caching
  caching:
    enabled: true
    cache_directory: "cache"
    max_cache_size: 100  # MB
    cache_duration: 3600 # seconds
  
  # Response optimization
  response:
    streaming_enabled: true
    chunk_size: 1024
    buffer_size: 4096
  
  # Resource management
  resources:
    max_memory_usage: 1024  # MB
    connection_timeout: 30   # seconds
    max_retries: 3
    retry_delay: 1.0        # seconds

# Logging Configuration
logging:
  
  # Log levels
  level: "INFO"           # DEBUG, INFO, WARNING, ERROR, CRITICAL
  
  # Log destinations
  destinations:
    console: true
    file: true
    
  # File logging
  file_logging:
    directory: "logs"
    filename_format: "{name}_{timestamp}.log"
    max_size: "10MB"
    backup_count: 5
    rotation: "time"      # time, size
  
  # Log formatting
  formatting:
    include_timestamp: true
    include_level: true
    include_module: true
    date_format: "%Y-%m-%d %H:%M:%S"

# Security Configuration
security:
  
  # Input validation
  input_validation:
    max_input_length: 5000
    filter_harmful_content: true
    sanitize_inputs: true
  
  # Code analysis
  code_analysis:
    security_scan: true
    vulnerability_check: true
    safe_execution: false
  
  # Access control
  access_control:
    require_authentication: false
    rate_limiting: false
    audit_logging: true

# Development Settings
development:
  
  # Debugging
  debug:
    enabled: false
    verbose_logging: false
    show_stack_traces: false
  
  # Experimental features
  experimental:
    enabled: false
    features: []
  
  # Testing
  testing:
    unit_tests: true
    integration_tests: false
    performance_tests: false

# Monitoring and Analytics
monitoring:
  
  # Usage tracking
  usage_tracking:
    enabled: true
    track_requests: true
    track_performance: true
    track_errors: true
  
  # Metrics collection
  metrics:
    collect_system_metrics: true
    collect_model_metrics: true
    collect_user_metrics: false
  
  # Health checks
  health_checks:
    enabled: true
    interval: 60          # seconds
    endpoints: ["ollama"]
  
  # Alerts
  alerts:
    enabled: false
    memory_threshold: 80  # percentage
    cpu_threshold: 80     # percentage
    error_threshold: 10   # errors per minute 