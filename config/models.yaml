# Model Configuration - Generic configuration for different LLM providers
# Avoid hardcoding specific model names or versions

# Model Profiles - Different performance/quality tiers
model_profiles:
  
  # High-performance models for complex tasks
  high_performance:
    context_length: 131072    # Large context for complex projects
    max_tokens: 8192         # Extended responses
    temperature: 0.1         # Conservative for production code
    top_p: 0.9              # Nucleus sampling
    top_k: 40               # Controlled diversity
    timeout: 300            # Extended timeout for complex tasks
    description: "Optimized for complex code generation and analysis"
    use_cases:
      - "Large project development"
      - "Complex system architecture"
      - "Performance-critical applications"
      - "Production code generation"
  
  # Balanced models for general use
  balanced:
    context_length: 32768    # Standard context length
    max_tokens: 4096        # Standard response length
    temperature: 0.3        # Balanced creativity
    top_p: 0.9
    top_k: 40
    timeout: 120            # Standard timeout
    description: "General-purpose configuration for most tasks"
    use_cases:
      - "General code generation"
      - "Code improvements"
      - "Standard development tasks"
      - "Learning and prototyping"
  
  # Fast models for quick tasks
  fast:
    context_length: 8192     # Smaller context for speed
    max_tokens: 2048        # Shorter responses
    temperature: 0.2        # Slightly conservative
    top_p: 0.8
    top_k: 30
    timeout: 60             # Quick timeout
    description: "Optimized for speed and quick iterations"
    use_cases:
      - "Code snippets"
      - "Quick fixes"
      - "Simple scripts"
      - "Rapid prototyping"
  
  # Creative models for exploration
  creative:
    context_length: 16384    # Medium context
    max_tokens: 4096
    temperature: 0.7        # Higher creativity
    top_p: 0.95            # More diverse sampling
    top_k: 50
    timeout: 180
    description: "Enhanced creativity for innovative solutions"
    use_cases:
      - "Experimental features"
      - "Alternative approaches"
      - "Creative problem solving"
      - "Research and exploration"

# Provider-specific configurations
providers:
  
  # Ollama (local deployment)
  ollama:
    base_url: "http://127.0.0.1:11434"
    api_endpoints:
      chat: "/api/chat"
      generate: "/api/generate"
      tags: "/api/tags"
      show: "/api/show"
    
    # Connection settings
    connection:
      max_retries: 3
      retry_delay: 1.0
      connection_timeout: 10
      read_timeout: 300
    
    # Model detection patterns
    model_patterns:
      deepseek: "deepseek"
      coder: "coder"
      code: "code"
      dev: "dev"
    
    # Auto-select best available model
    auto_selection:
      enabled: true
      prefer_coder_models: true
      fallback_pattern: "*code*"
  
  # OpenAI (cloud deployment)
  openai:
    base_url: "https://api.openai.com/v1"
    api_endpoints:
      chat: "/chat/completions"
      models: "/models"
    
    # Model mappings to profiles
    model_mappings:
      "gpt-4": "high_performance"
      "gpt-3.5-turbo": "balanced"
      "gpt-3.5-turbo-16k": "balanced"
  
  # Anthropic (cloud deployment)
  anthropic:
    base_url: "https://api.anthropic.com/v1"
    api_endpoints:
      messages: "/messages"
    
    model_mappings:
      "claude-3-opus": "high_performance"
      "claude-3-sonnet": "balanced"
      "claude-3-haiku": "fast"

# Dynamic Model Selection
auto_selection:
  
  # Selection criteria
  criteria:
    - name: "context_requirements"
      priority: 1
      rules:
        - condition: "context_length > 50000"
          requires: "high_performance"
        - condition: "context_length > 20000"
          requires: "balanced"
        - condition: "context_length <= 20000"
          allows: ["fast", "balanced"]
    
    - name: "task_complexity"
      priority: 2
      rules:
        - condition: "task_type == 'architecture'"
          requires: "high_performance"
        - condition: "task_type == 'debugging'"
          prefers: "balanced"
        - condition: "task_type == 'snippet'"
          allows: "fast"
    
    - name: "response_time_requirements"
      priority: 3
      rules:
        - condition: "urgency == 'high'"
          prefers: "fast"
        - condition: "urgency == 'normal'"
          prefers: "balanced"
        - condition: "urgency == 'low'"
          allows: "high_performance"

# Performance optimization
performance:
  
  # Caching strategies
  caching:
    enabled: true
    cache_responses: true
    cache_duration: 3600  # 1 hour
    max_cache_size: 100   # MB
  
  # Connection pooling
  connection_pooling:
    enabled: true
    pool_size: 5
    max_connections: 10
    keep_alive: true
  
  # Response streaming
  streaming:
    enabled: true
    chunk_size: 1024
    buffer_size: 4096
  
  # Token usage tracking
  token_tracking:
    enabled: true
    log_usage: true
    warn_threshold: 0.8   # Warn at 80% of context limit
    alert_threshold: 0.95 # Alert at 95% of context limit

# Model-specific optimizations
optimizations:
  
  # Code generation specific
  code_generation:
    prefer_deterministic: true
    temperature_override: 0.1
    focus_on_correctness: true
    enable_syntax_validation: true
  
  # Creative tasks
  creative_tasks:
    allow_higher_temperature: true
    increase_top_k: true
    enable_diverse_sampling: true
  
  # Production deployment
  production:
    enforce_timeouts: true
    enable_fallbacks: true
    log_all_requests: true
    validate_responses: true

# Environment-specific settings
environments:
  
  development:
    profile: "balanced"
    debug_mode: true
    verbose_logging: true
    enable_experimental: true
  
  staging:
    profile: "balanced"
    debug_mode: false
    verbose_logging: false
    enable_experimental: false
  
  production:
    profile: "high_performance"
    debug_mode: false
    verbose_logging: false
    enable_experimental: false
    enforce_strict_validation: true 