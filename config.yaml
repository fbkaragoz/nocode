# Gelişmiş Otomatik Kod Oluşturma Sistemi Konfigürasyonu

# Ollama Ayarları
ollama:
  base_url: "http://127.0.0.1:11434"
  model_name: "huihui_ai/deepseek-r1-Fusion:32b-coder-9010"
  timeout: 300
  max_retries: 3
  
# Model Parametreleri
model_params:
  temperature: 0.1        # Düşük = tutarlı, Yüksek = yaratıcı
  top_p: 0.9
  top_k: 40
  max_tokens: 8192        # Increased for longer responses
  context_length: 131072  # Max context for DeepSeek R1 (131k)

# Recursive İyileştirme
recursive_improvement:
  max_cycles: 3
  improvement_threshold: 0.1
  analysis_depth: "deep"
  
# Kod Oluşturma Ayarları
code_generation:
  output_directory: "generated_code"
  save_format: "organized"  # organized, flat, timestamped
  auto_save: false
  file_extensions:
    python: ".py"
    javascript: ".js"
    typescript: ".ts"
    html: ".html"
    css: ".css"
    java: ".java"
    cpp: ".cpp"
    go: ".go"
    rust: ".rs"
    php: ".php"
    sql: ".sql"
    
# Sistem Promptları
prompts:
  base_coder: |
    Sen bir uzman yazılım geliştirici asistanısın. Kullanıcının isteklerini tam olarak anlayıp, 
    temiz, verimli ve iyi dokümante edilmiş kod üretiyorsun. Her zaman şu prensipler doğrultusunda çalış:
    1. DRY (Don't Repeat Yourself) prensibini uygula
    2. Clean Code standartlarına uy
    3. Error handling ekle
    4. Type hints kullan (Python için)
    5. Docstring'ler ve yorumlar ekle
    6. Performansı optimize et
    7. Security best practices uygula
    8. Kod örnekleriyle açıkla
    
  recursive_analyzer: |
    Sen bir kod analiz uzmanısın. Verilen kodları analiz edip, 
    recursive olarak geliştirilebilecek kısımları tespit ediyorsun.
    Her analiz sonrası şunları belirt:
    - Refactor edilebilir kodlar
    - Performance iyileştirmeleri
    - Eksik error handling
    - Güvenlik açıkları
    - Kod tekrarları
    - Test edilebilirlik
    - Maintainability iyileştirmeleri
    
  task_decomposer: |
    Sen bir proje yönetimi uzmanısın. Büyük kodlama görevlerini
    küçük, yönetilebilir parçalara bölebiliyorsun. Her görev için:
    1. Alt görevleri tanımla
    2. Öncelik sırası belirle
    3. Bağımlılıkları tespit et
    4. Zaman tahmini yap
    5. Gerekli teknolojileri listele
    6. Risk analizi yap
    7. Test stratejisi öner

# Logging Ayarları
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "auto_coder.log"
  max_size: "10MB"
  backup_count: 5
  
# Performance İzleme
performance:
  track_token_usage: true
  track_response_time: true
  track_memory_usage: false
  benchmark_mode: false
  
# Güvenlik Ayarları
security:
  code_analysis: true
  vulnerability_check: true
  safe_execution: false  # Sandbox modunda çalıştırma
  allowed_operations: ["read", "write", "execute"]
  
# İleri Seviye Özellikler
advanced:
  multi_language_support: true
  auto_documentation: true
  code_review_mode: true
  integration_testing: false
  continuous_improvement: true 